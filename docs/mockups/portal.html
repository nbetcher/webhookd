<title>webhookd Control Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg-darkest:#0a0a12;--bg-dark:#0d0d1a;--bg-panel:#111125;--bg-hover:#161638;--bg-input:#0e0e20;--bg-elev:#1c1c44;
  --border:#20204a;--glow:#00e0ff;--glow-dim:rgba(0,224,255,.45);
  --text:#eaf0fb;--text-2:#9fb0d6;--label:#7d8cb5;
  --cyan:#00e0ff;--green:#00ff95;--magenta:#ff2daa;--orange:#ff9500;--violet-text:#b794ff;--red:#ff3b5c;--yellow:#ffe11a;--blue:#1f9bff;
  --font-display:"Orbitron","Eurostile","Segoe UI",sans-serif;
  --font-mono:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:4px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg-darkest);color:var(--text);font-family:var(--font-mono);font-size:14px;
  background-image:linear-gradient(rgba(0,224,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,224,255,.035) 1px,transparent 1px);background-size:32px 32px}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100%}
aside{background:var(--bg-dark);border-right:1px solid var(--border);padding-block:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:3px;color:var(--cyan);text-shadow:0 0 8px var(--glow-dim);padding:0 18px 18px;font-size:15px}
.brand small{display:block;color:var(--label);font-weight:400;font-size:10px;letter-spacing:2px;margin-top:4px;text-shadow:none}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 18px;font-family:var(--font-display);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-2);border-left:2px solid transparent}
nav button:hover{background:var(--bg-hover);color:var(--text)}
nav button[aria-current="page"]{color:var(--cyan);border-left-color:var(--cyan);background:linear-gradient(90deg,rgba(0,224,255,.12),transparent)}
nav button:focus-visible{outline:1px solid var(--cyan);outline-offset:-1px}
.navcount{font-family:var(--font-mono);font-size:11px;letter-spacing:0;padding:1px 6px;border-radius:9px;background:rgba(255,59,92,.15);color:var(--red)}
.who{margin:22px 18px 0;padding-top:14px;border-top:1px solid var(--border);color:var(--label);font-size:12px;line-height:1.6}
main{padding-block:20px;padding-inline:24px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-family:var(--font-display);font-size:18px;letter-spacing:2.5px;text-transform:uppercase;margin:0;font-weight:600;text-wrap:balance}
h2{font-family:var(--font-display);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--label);margin:0 0 12px;font-weight:400}
.live{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--green);border:1px solid rgba(0,255,149,.4);padding:4px 10px;border-radius:12px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.sample{font-size:11px;color:var(--yellow);border:1px dashed rgba(255,225,26,.5);padding:3px 8px;border-radius:var(--r)}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:inset 0 0 0 1px rgba(0,224,255,.03)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .v{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-family:var(--font-display);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--label);margin-bottom:6px}
.kpi .d{font-size:12px;color:var(--text-2);margin-top:4px}
.c-cyan{color:var(--cyan);text-shadow:0 0 10px var(--glow-dim)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-orange{color:var(--orange)}.c-yellow{color:var(--yellow)}.c-vio{color:var(--violet-text)}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:900px){.two{grid-template-columns:1fr}}
@media (max-width:720px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;padding-block:10px}nav{flex-direction:row;overflow-x:auto}nav button{border-left:0;border-bottom:2px solid transparent;padding:8px 12px}nav button[aria-current="page"]{border-bottom-color:var(--cyan)}.who,.brand small{display:none}main{padding-inline:16px}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--bg-dark);font-family:var(--font-display);font-weight:400;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--label);padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid rgba(32,32,74,.7);white-space:nowrap}
tbody tr:hover{background:var(--bg-hover)}
tbody tr.sel{background:rgba(0,224,255,.07)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid currentColor;line-height:1.6}
.p-run{color:var(--cyan)}.p-pend{color:var(--text-2)}.p-ok{color:var(--green)}.p-dead{color:var(--red)}.p-retry{color:var(--orange)}.p-snz{color:var(--violet-text)}.p-pause{color:var(--yellow)}
.btn{all:unset;cursor:pointer;font-family:var(--font-display);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;padding:7px 12px;border:1px solid var(--border);border-radius:var(--r);color:var(--text-2);background:var(--bg-input)}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn:focus-visible{outline:1px solid var(--cyan)}
.btn.primary{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 10px rgba(0,224,255,.2)}
.btn.warn{border-color:rgba(255,149,0,.6);color:var(--orange)}
.btn.danger{border-color:rgba(255,59,92,.6);color:var(--red)}
.btn[disabled]{opacity:.35;pointer-events:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}
input[type=checkbox]{accent-color:var(--cyan)}
select,input[type=text],textarea{background:var(--bg-input);color:var(--text);border:1px solid var(--border);border-radius:var(--r);font-family:var(--font-mono);font-size:13px;padding:6px 8px}
select:focus,input:focus,textarea:focus{outline:1px solid var(--cyan);border-color:var(--cyan)}
.feed{display:flex;flex-direction:column;gap:0;font-size:12px;max-height:330px;overflow:auto}
.feed div{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid rgba(32,32,74,.6)}
.feed time{color:var(--label)}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.hookgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.hook{border-left:3px solid var(--green)}
.hook.warn{border-left-color:var(--orange)}.hook.bad{border-left-color:var(--red)}.hook.paused{border-left-color:var(--yellow)}
.hook b{font-family:var(--font-display);font-size:12px;letter-spacing:1px;font-weight:600}
.hook .row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-top:6px}
.code{background:var(--bg-darkest);border:1px solid var(--border);border-radius:var(--r);font-size:13px;line-height:1.6;overflow:auto;padding:10px 0;counter-reset:ln}
.code span{display:block;padding:0 12px 0 0;white-space:pre}
.code span::before{counter-increment:ln;content:counter(ln);display:inline-block;width:34px;margin-right:12px;text-align:right;color:#3b4570}
.k{color:var(--magenta)}.s{color:var(--green)}.cm{color:var(--label)}.tv{color:var(--cyan)}
.tree{font-size:13px;display:flex;flex-direction:column;gap:2px}
.tree button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:var(--r)}
.tree button:hover{background:var(--bg-hover)}.tree button.on{background:rgba(0,224,255,.1);color:var(--cyan)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-family:var(--font-display);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--cyan);border-bottom-color:var(--cyan)}
.layer{font-size:11px;padding:0 6px;border-radius:3px;background:var(--bg-elev);color:var(--violet-text)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;font-size:13px;align-items:center}
.kv dt{color:var(--label)}.kv dd{margin:0}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
.switch input{appearance:none;width:32px;height:16px;border-radius:9px;background:var(--bg-elev);border:1px solid var(--border);position:relative;cursor:pointer}
.switch input::after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:var(--label);transition:left .15s}
.switch input:checked{border-color:var(--green)}.switch input:checked::after{left:17px;background:var(--green);box-shadow:0 0 6px var(--green)}
.verdict{font-family:var(--font-display);font-size:14px;letter-spacing:2px;padding:10px;border:1px solid currentColor;border-radius:var(--r);text-align:center}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:3px;margin-right:6px;vertical-align:middle}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg-elev);border:1px solid var(--cyan);color:var(--text);padding:10px 14px;border-radius:var(--r);box-shadow:0 0 18px rgba(0,224,255,.25);font-size:13px;max-width:calc(100% - 32px)}
.muted{color:var(--text-2);font-size:12px;line-height:1.6}
.lock{font-size:11px;color:var(--red);border:1px solid rgba(255,59,92,.5);border-radius:3px;padding:0 5px}
</style>

<div class="shell">
  <aside>
    <div class="brand">WEBHOOKD<small>CONTROL GRID · v2 mockup</small></div>
    <nav id="nav" aria-label="Portal sections">
      <button data-v="dash" aria-current="page">Dashboard</button>
      <button data-v="queues">Queues <span class="navcount">7 dead</span></button>
      <button data-v="scripts">Scripts</button>
      <button data-v="conds">Conditions</button>
      <button data-v="notify">Notifications</button>
      <button data-v="metrics">Metrics &amp; SLA</button>
      <button data-v="logs">Logs</button>
      <button data-v="audit">Audit</button>
    </nav>
    <div class="who">nick · <span class="c-vio">admin</span><br>admin: 127.0.0.1:8081<br>store: bolt · 4.2 MB</div>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="title">Dashboard</h1>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="sample">Sample data</span><span class="live"><i></i>LIVE · SSE</span></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const HOOKS=[
 {n:'deploy',run:1,pend:3,dead:0,st:'ok',last:'exit 0 · 41s',sla:'99.2%'},
 {n:'github/push',run:2,pend:11,dead:2,st:'warn',last:'retry 2/5 · exit 75',sla:'96.1%'},
 {n:'backup/nightly',run:0,pend:0,dead:0,st:'paused',last:'paused until 04:00',sla:'100%'},
 {n:'stripe/invoice',run:1,pend:0,dead:5,st:'bad',last:'dead · exit 1',sla:'91.4%'},
 {n:'ha/doorbell',run:0,pend:0,dead:0,st:'ok',last:'exit 0 · 0.3s',sla:'100%'},
 {n:'echo',run:0,pend:0,dead:0,st:'ok',last:'exit 0 · 0.1s',sla:'100%'}];
const SEV={info:'var(--cyan)',warning:'var(--orange)',error:'var(--red)',critical:'var(--magenta)'};
const EVENTS=[
 ['14:02:11','critical','sla.breach','stripe/invoice success 91.4% < 98%'],
 ['14:01:57','error','job.dead','stripe/invoice #88412 retries exhausted (5/5)'],
 ['14:01:40','warning','queue.near_full','github/push 41/50 pending'],
 ['13:58:03','error','webhook.not_executable','scripts/ha/garage.sh called without +x'],
 ['13:55:20','critical','script.modified','deploy.sh edited by nick (v14)'],
 ['13:40:00','info','maintenance.start','backup/nightly held until 04:00'],
 ['13:31:09','info','script.created','scripts/ha/garage.sh']];
const JOBS=[
 [88431,'github/push','running','1/5','0.4s','12s'],[88430,'github/push','retry_wait','2/5','—','next 13:03:40'],
 [88429,'deploy','running','1/1','1.1s','41s'],[88428,'github/push','pending','0/5','8.2s','—'],
 [88427,'github/push','snoozed','0/5','—','until 15:00'],[88412,'stripe/invoice','dead','5/5','0.2s','exit 1'],
 [88409,'stripe/invoice','dead','5/5','0.3s','exit 1'],[88401,'deploy','succeeded','1/1','0.1s','exit 0']];
const PILL={running:'p-run',pending:'p-pend',retry_wait:'p-retry',snoozed:'p-snz',dead:'p-dead',succeeded:'p-ok'};
const $=s=>document.querySelector(s);
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function feed(){return EVENTS.map(e=>`<div><time>${e[0]}</time><span><span class="sev" style="background:${SEV[e[1]]}"></span><span style="color:${SEV[e[1]]}">${e[2]}</span> <span class="muted">${e[3]}</span></span></div>`).join('')}

function areaChart(series,{h=180,max}={}){
  const W=640,H=h,pl=34,pr=8,pt=10,pb=22,n=series[0].d.length;
  const mx=max??Math.ceil(Math.max(...series.flatMap(s=>s.d))/10)*10;
  const x=i=>pl+i*(W-pl-pr)/(n-1),y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#20204a" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" fill="#7d8cb5" font-size="10" text-anchor="end" font-family="Share Tech Mono,monospace">${Math.round(v)}</text>`}
  const lbl=['-24h','-18h','-12h','-6h','now'];lbl.forEach((t,k)=>{g+=`<text x="${x(k*(n-1)/4)}" y="${H-6}" fill="#7d8cb5" font-size="10" text-anchor="${k==0?'start':k==4?'end':'middle'}" font-family="Share Tech Mono,monospace">${t}</text>`});
  series.forEach(s=>{const p=s.d.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    g+=`<polygon points="${x(0)},${y(0)} ${p} ${x(n-1)},${y(0)}" fill="${s.c}" fill-opacity=".10"/><polyline points="${p}" fill="none" stroke="${s.c}" stroke-width="1.6"/><circle cx="${x(n-1)}" cy="${y(s.d[n-1])}" r="3.5" fill="${s.c}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="chart">${g}</svg>`}
const THR=[22,18,15,12,10,9,14,26,48,61,58,55,52,60,64,59,57,54,49,41,36,31,27,24,30];
const FAIL=[1,1,0,0,0,0,1,2,3,4,3,2,6,9,12,11,8,5,4,3,2,2,1,1,2];

const V={
dash:()=>`
 <div class="grid kpis">
  <div class="panel kpi"><div class="l">Pending</div><div class="v c-cyan">14</div><div class="d">cap 500 global</div></div>
  <div class="panel kpi"><div class="l">Running</div><div class="tv">4<span class="muted"> / 8</span></div><div class="d">workers busy</div></div>
  <div class="panel kpi"><div class="l">Dead letter</div><div class="v c-red">7</div><div class="d">+5 last hour</div></div>
  <div class="panel kpi"><div class="l">Success 1h</div><div class="v c-green">97.8%</div><div class="d">1,284 jobs</div></div>
  <div class="panel kpi"><div class="l">SLA</div><div class="v c-orange">1 breach</div><div class="d">stripe/invoice</div></div>
  <div class="panel kpi"><div class="l">p95 wait</div><div class="tv">0.8s</div><div class="d">scheduler lag 2ms</div></div>
 </div>
 <div class="grid two" style="margin-top:14px">
  <div class="panel"><h2>Hooks</h2><div class="grid hookgrid">${HOOKS.map(h=>`
   <div class="panel hook ${h.st=='ok'?'':h.st}" style="padding:12px"><b>${h.n}</b>
    <div class="row"><span>run ${h.run} · pend ${h.pend}</span><span class="${h.dead?'c-red':''}">dead ${h.dead}</span></div>
    <div class="row"><span>${h.last}</span></div><div class="row"><span>SLA ${h.sla}</span>${h.st=='paused'?'<span class="pill p-pause">paused</span>':''}</div></div>`).join('')}</div></div>
  <div class="panel"><h2>Event stream</h2><div class="feed">${feed()}</div></div>
 </div>`,
queues:()=>`
 <div class="panel" style="margin-bottom:14px"><div class="toolbar">
   <label>Hook <select id="qh">${HOOKS.map(h=>`<option>${h.n}</option>`).join('')}</select></label>
   <span class="pill p-run">concurrency 2</span><span class="pill p-pend">41 / 50 pending</span><span class="pill p-retry">rate 30/min</span>
   <span class="spacer"></span>
   <button class="btn warn" data-t="Hook paused. New jobs are accepted and held.">Pause</button>
   <button class="btn" data-t="Hook snoozed until 15:00.">Snooze hook…</button>
   <button class="btn" data-t="Draining: no new jobs, finishing 41 pending.">Drain</button>
   <button class="btn danger" data-t="Type the hook name to confirm purge.">Purge…</button></div></div>
 <div class="panel"><div class="toolbar">
   <select aria-label="State"><option>All states</option><option>pending</option><option>retry_wait</option><option>snoozed</option><option>dead</option></select>
   <input type="text" id="qsearch" placeholder="Filter: id, dedup key, label…" aria-label="Filter jobs">
   <span class="spacer"></span><span class="muted" id="selcount">0 selected</span>
   <button class="btn bulk" disabled data-t="Requeued selected jobs.">Requeue</button>
   <button class="btn bulk" disabled data-t="Snoozed selected jobs for 1h.">Snooze 1h</button>
   <button class="btn bulk" disabled data-t="Opened replay editor with payload + headers.">Replay…</button>
   <button class="btn danger bulk" disabled data-t="Deleted selected jobs. Logged to audit.">Delete</button></div>
  <div class="tablewrap"><table><thead><tr><th><input type="checkbox" id="all" aria-label="Select all"></th><th>ID</th><th>Hook</th><th>State</th><th class="num">Attempt</th><th class="num">Waited</th><th>Detail</th></tr></thead>
  <tbody>${JOBS.map(j=>`<tr><td><input type="checkbox" class="rs" aria-label="Select job ${j[0]}"></td><td class="c-cyan">#${j[0]}</td><td>${j[1]}</td><td><span class="pill ${PILL[j[2]]}">${j[2]}</span></td><td class="num">${j[3]}</td><td class="num">${j[4]}</td><td class="muted">${j[5]}</td></tr>`).join('')}</tbody></table></div>
  <p class="muted">Bulk actions preview the matching count first, cap at 10,000 jobs, and write an audit entry.</p></div>`,
scripts:()=>`
 <div class="grid" style="grid-template-columns:minmax(0,220px) minmax(0,1fr)">
  <div class="panel"><h2>scripts/</h2><div class="tree">
   <button class="on">deploy.sh <span class="c-green">+x</span></button>
   <button>github/push.sh <span class="c-green">+x</span></button>
   <button>stripe/invoice.py <span class="c-green">+x</span></button>
   <button>ha/doorbell.sh <span class="c-green">+x</span></button>
   <button>ha/garage.sh <span class="c-red">−x</span></button>
   <button>echo.js <span class="c-green">+x</span></button></div></div>
  <div class="panel">
   <div class="toolbar"><b style="font-family:var(--font-display);letter-spacing:1px">deploy.sh</b><span class="muted">v14 · edited 13:55 by nick</span><span class="spacer"></span>
    <label class="switch"><input type="checkbox" checked id="xbit"> executable</label>
    <button class="btn" data-t="Validation passed: shebang ok, bash -n ok.">Validate</button>
    <button class="btn" data-t="Showing diff v13 → v14.">History</button>
    <button class="btn primary" data-t="Re-authenticate to save (step-up, 5 min).">Save</button></div>
   <div class="tabs" id="stabs"><button class="on" data-s="code">Script</button><button data-s="cfg">Config</button><button data-s="eff">Effective</button><button data-s="test">Test fire</button></div>
   <div id="spane"></div></div></div>`,
conds:()=>`
 <div class="grid two">
  <div class="panel"><h2>Shared condition sets · conditions.d/</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Success</th><th>Retry</th><th>Fail</th><th class="num">Used by</th></tr></thead><tbody>
   <tr><td class="c-cyan">gh-deploy</td><td>exit 0 + /^DEPLOYED/</td><td>75, timeout</td><td>2, 64, 65</td><td class="num">3</td></tr>

const SP={
code:`<div class="code">${['<span class="k">#!/usr/bin/env bash</span>','<span class="k">set</span> -euo pipefail','<span class="cm"># hook_attempt / hook_max_attempts exported by webhookd</span>','<span class="k">echo</span> <span class="s">"attempt $hook_attempt of $hook_max_attempts"</span>','ref=$(jq -r .ref <<< <span class="s">"$1"</span>)','git -C /srv/app fetch origin && git -C /srv/app checkout <span class="s">"$ref"</span>','docker compose up -d --build','<span class="k">echo</span> <span class="s">"DEPLOYED $ref"</span>','<span class="k">echo</span> <span class="s">"notify: deployed $ref"</span>'].map(l=>`<span>${l}</span>`).join('')}</div>`,

function render(v){
  $('#view').innerHTML=V[v]();
  $('#title').textContent=document.querySelector(`nav button[data-v="${v}"]`).firstChild.textContent.trim();
  document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.v==v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(v=='scripts'){const sp=$('#spane');sp.innerHTML=SP.code;$('#stabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#stabs button').forEach(x=>x.classList.toggle('on',x==b));sp.innerHTML=SP[b.dataset.s]};
    $('#xbit').onchange=e=>toast(e.target.checked?'chmod u+x deploy.sh (audited).':'Executable bit removed. Calls will return 500 + webhook.not_executable.')}
  if(v=='queues'){const upd=()=>{const rs=[...document.querySelectorAll('.rs')];const n=rs.filter(r=>r.checked).length;rs.forEach(r=>r.closest('tr').classList.toggle('sel',r.checked));$('#selcount').textContent=n+' selected';document.querySelectorAll('.bulk').forEach(b=>b.disabled=!n)};
    $('#view').addEventListener('change',e=>{if(e.target.id=='all')document.querySelectorAll('.rs').forEach(r=>r.checked=e.target.checked);upd()})}
  if(v=='conds'){const ev=()=>{const s=$('#cset').value,x=+$('#cexit').value,o=$('#cout').value;let r;
    if(s=='gh-deploy'){r=[2,64,65].includes(x)?['FAIL','fail.exit_codes','c-red']:x==75?['RETRY','retry.exit_codes','c-orange']:x==0&&/^DEPLOYED/m.test(o)?['SUCCESS','success.output_match','c-green']:['FAIL','default: fail','c-red']}
    else if(s=='http-5xx-retry'){r=/HTTP 5\d\d/.test(o)?['RETRY','retry.output_match','c-orange']:/HTTP 4\d\d/.test(o)?['FAIL','fail.output_match','c-red']:x==0?['SUCCESS','success.exit_codes','c-green']:['FAIL','default: fail','c-red']}
    else{r=x==0&&!/error/i.test(o)?['SUCCESS','success','c-green']:['FAIL','fail: any','c-red']}
    const d=$('#cverd');d.className='verdict '+r[2];d.textContent=`${r[0]} · matched ${r[1]}`};
    ['#cset','#cexit','#cout'].forEach(s=>$(s).addEventListener('input',ev))}
}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){render(b.dataset.v)}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)toast(b.dataset.t)});
render('dash');
</script>
